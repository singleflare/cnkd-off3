<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle full screen</title>
</head>

<body>
  <style>
    * {
      -webkit-user-select: none;
      /* Safari */
      -ms-user-select: none;
      /* IE 10 and IE 11 */
      user-select: none;
      /* Standard syntax */
      pointer-events: none;
    }

    @font-face {
      font-family: utm-thanh-nhac;
      src: url("UTM-Thanh-Nhac-TL.ttf");
    }

    @font-face {
      font-family: 'Myriad Pro';
      src: url('MYRIADPRO-SEMIBOLD.OTF');
    }

    @font-face {
      font-family: 'Myriad Pro Semibold Semi Condensed';
      src: url('MYRIADPRO-SEMIBOLDSEMICN.OTF');
    }

    body {
      background-color: white;
      margin: 0;
      overflow: hidden;
    }

    #bg {
      position: absolute;
      background-image: url('bg2009.jpg');
      background-size: cover;
      z-index: -3;
      width: 1920px;
      height: 1080px;
      /* top: -5px;
      left: -5px;
      filter: blur(5px);
      background-color: black; */
    }

    :root {
      --idle: #00d5ff;
      --unopened: #caf9ff;
      --waitToOpen: #0026FF;
      --opened: #caf9ff;
    }

    p {
      font-family: 'Myriad Pro';
      font-size: 45pt;
      text-align: center;
      margin: 10px 0px;
      font-weight: 600;
      /* color: #163A66; */
      color: black;
    }

    #board {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(4, 1fr);
      left: 426.5px;
      top: 352px;
      scale: 1.6;
      gap: 11px;
    }

    .letter {
      background: var(--idle);
      width: 56px;
      height: 85px;
      border: 2px black solid;
      box-sizing: border-box;
    }

    @keyframes bobbing {
      0% {
        transform: scale(0)
      }

      100% {
        transform: scale(1)
      }
    }

    .letter p.animated {
      background-image: unset;
      animation: bobbing linear 0.3s;
    }

    .letter.hasLetter {
      background-image: unset;
      background-color: var(--opened);
    }

    .letter.waitToOpen {
      background-image: unset;
      background-color: var(--waitToOpen);
    }

    .letter.shown {
      background-image: unset;
      background-color: var(--opened);
    }

    .letter.timer {
      background-color: var(--timer);
    }

    #p1Score,
    #p2Score,
    #p3Score {
      font-size: 60pt;
      color: white;
      text-shadow: 2px 2px black;
    }

    #p1Name,
    #p2Name,
    #p3Name {
      font-size: 20pt;
      color: white;
      text-shadow: 2px 2px black;
    }

    #boardBg {
      position: absolute;
      top: 182px;
      width: 1800px;
      left: 60px;
    }

    .flexcon {
      display: flex;
      width: 1920px;
      position: relative;
    }

    .flexcon>* {
      width: 100%;
      text-align: center;
    }
  </style>
  <div id='bg'></div>
  <img src='puzzle2009.png' id='boardBg'>
  <div id="board"></div>
  <img src='buc.png' style='position:absolute;
    top: 880px;
    width: 2000px;
    left: -50px;
    z-index: -1;
    height: 220px;'>
  <div class='flexcon'>
    <div id="p1Name"></div>
    <div id="p2Name"></div>
    <div id="p3Name"></div>
  </div>
  <div class='flexcon'>
    <div id="p1Score"></div>
    <div id="p2Score"></div>
    <div id="p3Score"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"
    integrity="sha512-xi/RZRIF/S0hJ+yJJYuZ5yk6/8pCiRlEXZzoguSMl+vk2i3m6UjUO/WcZ11blRL/O+rnj94JRGwt/CHbc9+6EA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const socket = io();
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    $(function () {
      for (let i = 0; i <= 63; i++) {
        if (i == 0 || i == 15 || i == 48 || i == 63) $('#board').append('<div class="letter" id="letter' + i + '" style="opacity:0;"><p></p></div>');
        else {
          $('#board').append('<div class="letter" style="background: rgb(' + randInt(0, 80) + ',213,255);" id="letter' + i + '"><p></p></div>');
        }
      }
    })
    function playSound(url) {
      const sound = new Howl({
        src: [url]
      });
      sounds.push(sound)
      sound.play();
    }
    let sounds = []
    socket.on('playSound', url => {
      if (url == './sounds/moochu.mp3') {
        playSound('./sounds/moochu2012.wav')
      }
      else playSound(url)
    })
    socket.on('stopAllSounds', () => {
      for (let sound of sounds) {
        sound.stop()
      }
      sounds = []
    })

    socket.on('reveal', (data) => {
      if (data.state == 0) {
        $('#letter' + data.index).removeClass('waitToOpen timer shown')
      }
      else if (data.state == 1) {
        $('#letter' + data.index).css('background', '')
        $('#letter' + data.index).removeClass('waitToOpen timer shown').addClass('shown');
      }
      else if (data.state == 2) {
        playSound('./sounds/mochu2012p1.wav');
        $('#letter' + data.index).removeClass('waitToOpen timer shown').addClass('waitToOpen');
      }
      else if (data.state == 3) {
        playSound('./sounds/mochu2012p2.wav');
        $('#letter' + data.index).removeClass('waitToOpen timer shown').addClass('shown');
        $('#letter' + data.index + ' p').addClass('animated')
        $('#letter' + data.index + ' p').text(data.letter);
      }
      else if (data.state == 4) {
        $('#letter' + data.index).removeClass('waitToOpen timer shown').addClass('shown');
        $('#letter' + data.index + ' p').text(data.letter);
      }
    })

    socket.on('solvePuzzle', data => {
      console.log(data);
      let i = 0
      let interval = setInterval(() => {
        $('#letter' + data.idxToOpen[i] + ' p').text(data.solvedPuzzle[data.idxToOpen[i]]);
        i++
        if (i >= data.idxToOpen.length) clearInterval(interval)
      }, 10)
    })
    socket.on('resetPuzzle', () => {
      for (let i = 0; i <= 63; i++) {
        $('#letter' + i).removeClass('waitToOpen shown timer');
        $('#letter' + i + ' p').text('');
        $('#letter' + i + ' p').removeClass('animated')
      }
    })
  </script>

</body>

</html>
